# Standalone Coolify application; do not merge with the upstream root Compose file.
# XIBO_DATA_DIR must be an absolute, persistent directory on the Docker host.
services:
  cms-db:
    image: mysql:${MYSQL_IMAGE_TAG:-8.4}
    volumes:
      - "${XIBO_DATA_DIR:?Set an absolute persistent host directory}/db:/var/lib/mysql:Z"
    environment:
      MYSQL_DATABASE: cms
      MYSQL_USER: cms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set the shared CMS database password}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    mem_limit: 1g
    restart: always

  cms-xmr:
    image: ghcr.io/xibosignage/xibo-xmr:${XMR_IMAGE_TAG:-1.4}
    ports:
      - "${XIBO_XMR_BIND_IP:-0.0.0.0}:${XIBO_XMR_PORT:-9505}:9505"
    restart: always
    mem_limit: 256m

  cms-web:
    image: ghcr.io/xibosignage/xibo-cms:${CMS_IMAGE_TAG:-release-4.5.5}
    volumes:
      - "${XIBO_DATA_DIR:?Set an absolute persistent host directory}/cms/custom:/var/www/cms/custom:Z"
      - "${XIBO_DATA_DIR:?Set an absolute persistent host directory}/backup:/var/www/backup:Z"
      - "${XIBO_DATA_DIR:?Set an absolute persistent host directory}/cms/library:/var/www/cms/library:Z"
      - "${XIBO_DATA_DIR:?Set an absolute persistent host directory}/cms/web/userscripts:/var/www/cms/web/userscripts:Z"
      - "${XIBO_DATA_DIR:?Set an absolute persistent host directory}/cms/ca-certs:/var/www/cms/ca-certs:Z"
    environment:
      MYSQL_HOST: cms-db
      MYSQL_DATABASE: cms
      MYSQL_USER: cms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set the shared CMS database password}
      XMR_HOST: cms-xmr
      CMS_USE_MEMCACHED: "true"
      MEMCACHED_HOST: cms-memcached
      CMS_SERVER_NAME: ${CMS_SERVER_NAME:?Set the CMS public hostname}
      CMS_SMTP_SERVER: ${CMS_SMTP_SERVER:-}
      CMS_SMTP_USERNAME: ${CMS_SMTP_USERNAME:-}
      CMS_SMTP_PASSWORD: ${CMS_SMTP_PASSWORD:-}
      CMS_SMTP_USE_TLS: ${CMS_SMTP_USE_TLS:-YES}
      CMS_SMTP_USE_STARTTLS: ${CMS_SMTP_USE_STARTTLS:-YES}
      CMS_SMTP_REWRITE_DOMAIN: ${CMS_SMTP_REWRITE_DOMAIN:-}
      CMS_SMTP_HOSTNAME: ${CMS_SMTP_HOSTNAME:-}
      CMS_SMTP_FROM_LINE_OVERRIDE: ${CMS_SMTP_FROM_LINE_OVERRIDE:-YES}
      CMS_SMTP_FROM: ${CMS_SMTP_FROM:-}
    expose:
      - "80"
    restart: always
    mem_limit: 1g

  cms-memcached:
    image: memcached:${MEMCACHED_IMAGE_TAG:-alpine}
    command: memcached -m 15
    restart: always
    mem_limit: 100M

  cms-quickchart:
    image: ianw/quickchart:${QUICKCHART_IMAGE_TAG:-latest}
    restart: always
